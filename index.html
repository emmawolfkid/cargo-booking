<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mwanza Cargo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

  <div class="header">
    <img src="logo.png" class="logo">
    <h1>Mwanza Cargo</h1>
    <p>Usafirishaji Salama na Haraka</p>
  </div>

  <div class="card">

    <form name="cargo-booking" method="POST" data-netlify="true">

      <input type="hidden" name="form-name" value="cargo-booking">
      <input type="hidden" name="items" id="itemsInput">

      <h3>Taarifa za Mteja</h3>
      <input type="text" name="name" placeholder="Jina Kamili" required>
      <input type="tel" name="phone" placeholder="Namba ya Simu" required>

      <h3>Mahali</h3>
      <input type="text" name="pickup" id="pickup" placeholder="Mahali pa Kuchukua" required>
      <input type="text" name="destination" id="destination" placeholder="Mahali pa Kupeleka" required>

      <button type="button" onclick="getLocation()">📍 Tumia Location Yangu</button>

      <h3>Chagua Mizigo</h3>

      <input type="text" id="search" placeholder="Tafuta mzigo...">

      <select id="categoryFilter">
        <option value="all">Aina zote</option>
      </select>

      <div class="items"></div>

      <h3>Mizigo Mingine</h3>
      <textarea name="custom_items" placeholder="Andika mizigo mingine hapa..."></textarea>

      <p class="note">
        💡 Bei halisi itathibitishwa baada ya kupokea maelezo yako
      </p>

      <button type="submit">Tuma Ombi</button>

    </form>

  </div>

</div>

<script src="scripts.js"></script>
</body>
</html>
