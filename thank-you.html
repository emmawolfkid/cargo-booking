<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ombi Limepokelewa</title>

<style>
body {
  font-family: 'Segoe UI';
  background:#f4f6f9;
  padding:20px;
}

.card {
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

.btn {
  padding:12px;
  display:block;
  margin-top:10px;
  text-decoration:none;
  color:white;
  border-radius:8px;
}

.whatsapp {
  background:#25D366;
}
</style>
</head>

<body>

<div class="card">

<h2>✅ Ombi Limepokelewa</h2>

<p>Tutawasiliana nawe kuthibitisha bei na usafirishaji.</p>

<p><strong>Mizigo:</strong> <span id="items"></span></p>

<a class="btn whatsapp" id="wa" target="_blank">
  Wasiliana WhatsApp
</a>

</div>

<script>
const name = localStorage.getItem('name');
const phone = localStorage.getItem('phone');
const pickup = localStorage.getItem('pickup');
const destination = localStorage.getItem('destination');
const items = localStorage.getItem('items');

document.getElementById("items").textContent = items;

const msg = `Habari, nimefanya ombi la usafirishaji.
Jina: ${name}
Simu: ${phone}
Kutoka: ${pickup}
Kwenda: ${destination}
Mizigo: ${items}`;

document.getElementById("wa").href =
  "https://wa.me/255765042935?text=" + encodeURIComponent(msg);
</script>

</body>
</html>
